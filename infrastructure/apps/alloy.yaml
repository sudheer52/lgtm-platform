apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 0.6.0
    helm:
      parameters:
        - name: alloy.controller.type
          value: daemonset
        - name: alloy.mounts.varlog
          value: "true"
        - name: alloy.mounts.dockercontainers
          value: "true"
        - name: "alloy.configMap.content"
          value: |
            discovery.kubernetes "pods" {
              role = "pod"
            }
            discovery.relabel "pod_logs" {
              targets = discovery.kubernetes.pods.targets
              rule {
                source_labels = ["__meta_kubernetes_namespace"]
                target_label  = "namespace"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_name"]
                target_label  = "pod"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_container_name"]
                target_label  = "container"
              }
              rule {
                source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name", "__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                separator     = ";"
                target_label  = "__path__"
                replacement   = "/var/log/pods/${1}_${2}_${3}/${4}/0.log"
                regex         = "([^;]+);([^;]+);([^;]+);([^;]+)"
                action        = "replace"
              }
            }
            loki.source.file "pod_logs" {
              targets    = discovery.relabel.pod_logs.output
              forward_to = [loki.write.default.receiver]
            }
            loki.write "default" {
              endpoint {
                url = "http://loki:3100/loki/api/v1/push"
              }
            }
            otelcol.receiver.otlp "default" {
              grpc { endpoint = "0.0.0.0:4317" }
              http { endpoint = "0.0.0.0:4318" }
              output {
                traces = [otelcol.exporter.otlp.tempo.input]
              }
            }
            otelcol.exporter.otlp "tempo" {
              client {
                endpoint = "http://tempo:4317"
                tls { insecure = true }
              }
            }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
