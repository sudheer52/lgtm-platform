apiVersion: v1
kind: Namespace
metadata:
  name: tns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tns-app
  namespace: tns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tns-app
  template:
    metadata:
      labels:
        app: tns-app
    spec:
      containers:
      - name: app
        image: grafana/tns-app:latest
        ports:
        - containerPort: 8080
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://alloy.monitoring.svc.cluster.local:4317"
        - name: OTEL_SERVICE_NAME
          value: "tns-app"
---
apiVersion: v1
kind: Service
metadata:
  name: tns-app
  namespace: tns
spec:
  selector:
    app: tns-app
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tns-db
  namespace: tns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tns-db
  template:
    metadata:
      labels:
        app: tns-db
    spec:
      containers:
      - name: db
        image: grafana/tns-db:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tns-db
  namespace: tns
spec:
  selector:
    app: tns-db
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tns-loadgen
  namespace: tns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tns-loadgen
  template:
    metadata:
      labels:
        app: tns-loadgen
    spec:
      containers:
      - name: loadgen
        image: grafana/tns-loadgen:latest
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://alloy.monitoring.svc.cluster.local:4317"
        - name: OTEL_SERVICE_NAME
          value: "tns-loadgen"
        args:
        - "http://tns-app:8080"
